# MkDocs Material configuration — builds docs/ into a searchable static site.
# Preview:  mkdocs serve     Build:  mkdocs build     Deploy:  mkdocs gh-deploy
site_name: De Novo Myostatin Binder Design
site_description: Reproducible RFdiffusion → ProteinMPNN → ESMFold pipeline targeting the myostatin knuckle epitope
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Concepts:
      - TGF-β superfamily: concepts/TGF-beta-superfamily.md
      - TGF-β receptor logic: concepts/tgf-beta-receptors.md
      - The knuckle epitope: concepts/epitope.md
      - PPI hotspots: concepts/PPI-hotspots.md
      - De novo binder design: concepts/de-novo-binder-design.md
      - Diffusion models: concepts/diffusion-models.md
      - Inverse folding: concepts/inverse-folding.md
      - Validation metrics: concepts/validation-metrics.md
  - Molecules:
      - GDF8 (myostatin): molecules/GDF8.md
      - GDF11: molecules/GDF11.md
      - ActRIIB: molecules/ActRIIB.md
      - Follistatin-288: molecules/follistatin-288.md
      - 5JI1 · apo GDF8: molecules/5JI1.md
      - 6MAC · GDF11:ActRIIB:ALK5: molecules/6MAC.md
      - 3HH2 · GDF8:Fst288: molecules/3HH2.md
  - Tools:
      - RFdiffusion: tools/RFdiffusion.md
      - ProteinMPNN: tools/ProteinMPNN.md
      - ESMFold: tools/ESMFold.md
      - AlphaFold2: tools/AlphaFold2.md
      - PyMOL: tools/PyMOL.md
      - TMalign: tools/TMalign.md
  - Methods:
      - 1 · Target preparation: methods/01-target-prep.md
      - 2 · Hotspot identification: methods/02-hotspots.md
      - 3 · RFdiffusion: methods/03-rfdiffusion.md
      - 4 · ProteinMPNN: methods/04-proteinmpnn.md
      - 5 · ESMFold validation: methods/05-esmfold.md
      - 6 · Ranking & selection: methods/06-ranking.md
  - Reference:
      - Glossary: reference/glossary.md
      - Hardware & Docker plan: reference/hardware-and-docker.md
